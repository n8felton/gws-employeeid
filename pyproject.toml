[project]
name = "gws-employeeid"
version = "0.1.0"
description = "Assign incremental Employee IDs to Google Workspace users based on account creation date."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "google-api-python-client",
    "google-auth",
]

[project.scripts]
gws-employeeid = "gws_employeeid.cli:main"
employeeid = "gws_employeeid.cli:main"
workspace-employee-id = "gws_employeeid.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gws_employeeid"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]
